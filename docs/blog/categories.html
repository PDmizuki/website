         if (category) {

         // 指定されたカテゴリに応じた記事を表示
         const filteredPosts = blogPosts.filter(post => !category || post.category === category);

         if (filteredPosts.length > 0) {
            filteredPosts.forEach(post => {
               const articleDiv = document.createElement('div');
               articleDiv.className = 'article';
