<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<link rel="manifest" href="./manifest.webmanifest">
<title>道標 β</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--text:#1d1f1e;--muted:#707571;--line:#e3e6e1;--accent:#2f5d50;--soft:#edf3f0;--danger:#9a4545;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}button,input,textarea,select{font:inherit}.app{max-width:760px;margin:auto;padding:14px 12px calc(96px + var(--safe))}.top{margin:2px 2px 12px}.top h1{font-size:19px;margin:0 0 4px}.top p{margin:0;color:var(--muted);font-size:12px}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px}.eyebrow{font-size:11px;color:var(--accent);font-weight:800}.guide h2{font-size:20px;line-height:1.45;margin:8px 0}.muted{color:var(--muted);font-size:12px;line-height:1.65}.section-title{font-size:13px;font-weight:800;margin:14px 2px 8px}.task,.memo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}.tag{font-size:10px;font-weight:800;color:var(--accent);background:var(--soft);padding:4px 8px;border-radius:99px}.check{width:30px;height:30px;border-radius:9px;border:1px solid #c9cfca;background:#fff}.task.done .check{background:var(--accent);color:#fff}.task.done .txt{text-decoration:line-through;color:var(--muted)}.txt{font-size:13px;line-height:1.55}.small{font-size:10px;color:var(--muted)}.btn{min-height:44px;border-radius:12px;padding:10px 13px;font-weight:800;border:1px solid var(--line);background:#fff}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.mini{min-height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:10px;font-weight:800;padding:7px 9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;outline:none}.textarea{min-height:84px;resize:vertical}.quick{display:grid;grid-template-columns:1fr auto;gap:8px}.quick .btn{min-width:56px}.bottom{position:fixed;left:10px;right:10px;bottom:max(10px,var(--safe));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:17px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.12);z-index:20}.bottom button{min-height:50px;border:0;background:transparent;border-radius:12px;font-size:11px;color:#666}.bottom button.active{background:var(--soft);color:var(--accent);font-weight:800}.fab{position:fixed;right:20px;bottom:calc(84px + var(--safe));width:56px;height:56px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;box-shadow:0 12px 28px rgba(47,93,80,.28);z-index:21}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;padding:10px;z-index:30}.sheet.open{display:flex}.sheetbox{width:100%;max-width:720px;margin:auto;background:#fff;border-radius:22px;padding:16px;max-height:88dvh;overflow:auto}.sheetbox h3{margin:0 0 10px}.select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px}.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.moods button.selected{background:var(--soft);color:var(--accent);border-color:#b9c9c1}.progress{height:8px;background:#e9ece8;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}.empty{color:var(--muted);font-size:12px;padding:14px;text-align:center}.update{position:fixed;left:12px;right:12px;top:12px;background:#1f2824;color:#fff;border-radius:14px;padding:11px 12px;display:none;align-items:center;gap:10px;z-index:50;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.update.show{display:flex}.update .btn{margin-left:auto;min-height:36px;padding:6px 10px}
</style>
</head>
<body>
<div id="update" class="update"><span>新しいバージョンがあります。</span><button id="updateBtn" class="btn primary">更新</button></div>
<main class="app">
<header class="top"><h1>道標 β</h1><p>日中は、見る・記録する・完了する。</p></header>

<section id="view-home" class="view active">
  <article class="card guide"><div class="eyebrow">🧭 今の道標</div><h2>今の状況を整理して、次の一歩を進めましょう。</h2><p class="muted">PCで分析した道標を、スマホでは実行に集中して確認します。</p><div class="actions"><button class="btn primary" data-go="tasks">今やることを見る</button></div></article>
  <div class="section-title">今やること</div><div id="homeTasks"></div>
  <div class="section-title">クイックメモ</div><div class="quick"><input id="homeMemo" class="input" placeholder="思いついたことを入力"><button id="homeSave" class="btn primary">保存</button></div>
  <div class="section-title">今日の感覚</div><article class="card"><div class="moods"><button class="btn mood" data-mood="good">◎ ちょうどいい</button><button class="btn mood" data-mood="hard">△ 少し大変</button><button class="btn mood" data-mood="none">× できなかった</button></div><textarea id="reflection" class="textarea" placeholder="一言だけ残す（任意）" style="margin-top:8px"></textarea></article>
</section>

<section id="view-tasks" class="view"><div class="section-title">やること</div><p class="muted">「今・次・あとで」だけで整理します。</p><div id="taskGroups"></div></section>

<section id="view-goals" class="view"><div class="section-title">目標</div><article class="card"><div class="eyebrow">今の目標</div><h2 id="goalText" style="font-size:18px;margin:8px 0">目標をPC版で設定してください</h2><div class="progress"><span id="goalBar" style="width:0%"></span></div><div class="row" style="margin-top:10px"><input id="goalProgress" class="input" type="number" min="0" max="100" value="0" aria-label="進捗率"><button id="goalSave" class="btn">進捗を保存</button></div></article></section>

<section id="view-memo" class="view"><div class="section-title">メモ / Inbox</div><p class="muted">メモ、アイデア、後で相談を1か所に保存します。</p><div id="consultCard" class="card"><div class="eyebrow">PCで相談</div><p class="muted"><strong id="consultCount">0件</strong> の相談があります。</p><button id="exportConsult" class="btn">相談キューを書き出す</button></div><div id="memoList"></div></section>
</main>

<button id="fab" class="fab" aria-label="追加">＋</button>
<nav class="bottom"><button class="active" data-view="home">⌂<br>ホーム</button><button data-view="tasks">✓<br>やること</button><button data-view="goals">◎<br>目標</button><button data-view="memo">✎<br>メモ</button></nav>

<div id="sheet" class="sheet" aria-hidden="true"><div class="sheetbox"><h3>追加する</h3><textarea id="composer" class="textarea" placeholder="思いついたことを書いてください"></textarea><select id="type" class="select" style="margin-top:8px"><option value="memo">メモ</option><option value="idea">アイデア</option><option value="consult">後で相談</option><option value="task">やること</option></select><div class="actions"><button id="closeSheet" class="btn">閉じる</button><button id="addItem" class="btn primary">保存</button></div></div></div>

<script>
(()=>{
const KEY='michishirube-mobile-v06';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const today=()=>new Date().toISOString().slice(0,10);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={tasks:[{id:uid(),text:'今の道標を確認する',stage:'now',done:false},{id:uid(),text:'今日できる小さな一歩を進める',stage:'next',done:false}],inbox:[],goal:{text:'目標をPC版で設定してください',progress:0},reflection:{date:'',mood:'',note:''}};let state;try{state=Object.assign(structuredClone(defaults),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{state=structuredClone(defaults)}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function stageLabel(s){return s==='now'?'今':s==='next'?'次':'あとで'}function setView(v){$$('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));$$('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));history.replaceState(null,'','#'+v);scrollTo(0,0)}
function taskHtml(t){return `<div class="task ${t.done?'done':''}"><div class="row"><button class="check" data-done="${t.id}">${t.done?'✓':''}</button><div class="grow txt"><span class="tag">${stageLabel(t.stage)}</span><br>${esc(t.text)}</div></div><div class="actions"><button class="mini" data-move="now" data-id="${t.id}">今</button><button class="mini" data-move="next" data-id="${t.id}">次</button><button class="mini" data-move="later" data-id="${t.id}">あとで</button><button class="mini danger" data-del-task="${t.id}">削除</button></div></div>`}
function memoHtml(m){return `<div class="memo"><div class="row"><span class="tag">${m.type==='consult'?'後で相談':m.type==='idea'?'アイデア':'メモ'}</span><div class="grow small">${new Date(m.createdAt).toLocaleString('ja-JP')}</div></div><div class="txt" style="margin-top:7px;white-space:pre-wrap">${esc(m.text)}</div><div class="actions">${m.type!=='consult'?`<button class="mini" data-convert="consult" data-id="${m.id}">後で相談</button>`:''}<button class="mini" data-convert="task" data-id="${m.id}">やること</button><button class="mini danger" data-del-memo="${m.id}">削除</button></div></div>`}
function render(){const active=state.tasks.filter(t=>!t.done);const now=active.filter(t=>t.stage==='now').slice(0,3);$('#homeTasks').innerHTML=now.length?now.map(taskHtml).join(''):'<div class="empty card">今やることはありません。</div>';$('#taskGroups').innerHTML=['now','next','later'].map(s=>`<div class="section-title">${stageLabel(s)}</div>${active.filter(t=>t.stage===s).map(taskHtml).join('')||'<div class="empty card">ありません</div>'}`).join('');$('#memoList').innerHTML=state.inbox.length?state.inbox.slice().sort((a,b)=>b.createdAt-a.createdAt).map(memoHtml).join(''):'<div class="empty card">まだメモはありません。</div>';$('#consultCount').textContent=state.inbox.filter(x=>x.type==='consult').length+'件';$('#goalText').textContent=state.goal.text;$('#goalProgress').value=state.goal.progress;$('#goalBar').style.width=Math.max(0,Math.min(100,state.goal.progress))+'%';const r=state.reflection.date===today()?state.reflection:{mood:'',note:''};$$('.mood').forEach(b=>b.classList.toggle('selected',b.dataset.mood===r.mood));$('#reflection').value=r.note||'';bind()}
function bind(){$$('[data-done]').forEach(b=>b.onclick=()=>{const t=state.tasks.find(x=>x.id===b.dataset.done);t.done=!t.done;save();render()});$$('[data-move]').forEach(b=>b.onclick=()=>{const t=state.tasks.find(x=>x.id===b.dataset.id);t.stage=b.dataset.move;save();render()});$$('[data-del-task]').forEach(b=>b.onclick=()=>{state.tasks=state.tasks.filter(x=>x.id!==b.dataset.delTask);save();render()});$$('[data-convert]').forEach(b=>b.onclick=()=>{const m=state.inbox.find(x=>x.id===b.dataset.id);if(b.dataset.convert==='task'){state.tasks.push({id:uid(),text:m.text,stage:'later',done:false});state.inbox=state.inbox.filter(x=>x.id!==m.id)}else m.type='consult';save();render()});$$('[data-del-memo]').forEach(b=>b.onclick=()=>{state.inbox=state.inbox.filter(x=>x.id!==b.dataset.delMemo);save();render()})}
function add(text,type){text=text.trim();if(!text)return;if(type==='task')state.tasks.push({id:uid(),text,stage:'later',done:false});else state.inbox.push({id:uid(),text,type,createdAt:Date.now()});save();render()}
$$('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$$('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go));$('#fab').onclick=()=>{$('#sheet').classList.add('open');$('#composer').focus()};$('#closeSheet').onclick=()=>$('#sheet').classList.remove('open');$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('open')};$('#addItem').onclick=()=>{add($('#composer').value,$('#type').value);$('#composer').value='';$('#sheet').classList.remove('open')};$('#homeSave').onclick=()=>{add($('#homeMemo').value,'memo');$('#homeMemo').value=''};$('#homeMemo').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('#homeSave').click()}};$$('.mood').forEach(b=>b.onclick=()=>{state.reflection={date:today(),mood:b.dataset.mood,note:$('#reflection').value};save();render()});$('#reflection').oninput=()=>{state.reflection={date:today(),mood:state.reflection.date===today()?state.reflection.mood:'',note:$('#reflection').value};save()};$('#goalSave').onclick=()=>{state.goal.progress=Math.max(0,Math.min(100,Number($('#goalProgress').value)||0));save();render()};$('#exportConsult').onclick=()=>{const items=state.inbox.filter(x=>x.type==='consult');if(!items.length)return alert('後で相談する内容はありません');const blob=new Blob([JSON.stringify({app:'michishirube',version:'0.6',type:'consult-queue',exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='michishirube-consult-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
const initial=location.hash.slice(1);setView(['home','tasks','goals','memo'].includes(initial)?initial:'home');render();
if('serviceWorker'in navigator){let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});navigator.serviceWorker.register('./sw.js').then(reg=>{function watch(sw){if(!sw)return;sw.addEventListener('statechange',()=>{if(sw.state==='installed'&&navigator.serviceWorker.controller)$('#update').classList.add('show')})}watch(reg.installing);reg.addEventListener('updatefound',()=>watch(reg.installing));$('#updateBtn').onclick=()=>{const w=reg.waiting||reg.installing;if(w)w.postMessage({type:'SKIP_WAITING'})};setInterval(()=>reg.update(),60*60*1000)}).catch(()=>{})}
})();
</script>
</body>
</html>
